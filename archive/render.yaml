# Archived — RK-main stays on Vercel; Render service should be decommissioned.
# See DEPLOYMENT.md.

services:
  - type: web
    name: rising-kashmir
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
