name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://risingkashmir.com
          # Auth.js requires a secret at build time when auth routes are compiled.
          AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-ok
          AUTH_GOOGLE_ID: 000000000000-ci-placeholder.apps.googleusercontent.com
          AUTH_GOOGLE_SECRET: GOCSPX-ci-placeholder-not-for-production
