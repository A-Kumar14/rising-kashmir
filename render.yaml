# Blueprint for https://render.com — connect repo, apply blueprint, then set secrets in the dashboard:
# AUTH_SECRET (or RK_AUTH_SECRET), AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET; optional REVALIDATE_SECRET
# REVALIDATE_SECRET (optional, for POST /api/revalidate)
services:
  - type: web
    name: rising-kashmir
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
